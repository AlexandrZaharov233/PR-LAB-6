name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Docker Compose (важно для GitHub runner)
      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install docker-compose -y

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build images (через compose)
      - name: Build images
        run: docker compose build

      # 5. Start full stack (DB + backend + frontend)
      - name: Start containers
        run: docker compose up -d

      # 6. Wait for backend startup (с retry)
      - name: Wait for backend
        run: |
          for i in {1..40}; do
            echo "Attempt $i"
            curl -f http://localhost:5000/tasks && exit 0
            sleep 2
          done
          echo "Backend failed"
          docker logs todo-backend || true
          exit 1

      # 7. Test GET tasks
      - name: Test GET tasks
        run: curl --fail http://localhost:5000/tasks

      # 8. Test POST task
      - name: Test POST task
        run: |
          curl --fail -X POST http://localhost:5000/tasks \
          -H "Content-Type: application/json" \
          -d '{"title":"GitHub Actions Test"}'

      # 9. Test frontend
      - name: Test Frontend
        run: curl --fail http://localhost:8080

      # 10. Show logs if fail
      - name: Show backend logs
        if: always()
        run: docker logs todo-backend || true

      # 11. Stop everything
      - name: Cleanup
        if: always()
        run: docker compose down -v --rmi all