name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔥 BUILD BACKEND
      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest ./backend

      # 🔥 BUILD FRONTEND
      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest ./frontend

      # 🔐 LOGIN
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🚀 PUSH BACKEND
      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest

      # 🚀 PUSH FRONTEND
      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

      # 🧪 TEST (через docker run вместо compose)
      - name: Run backend container
        run: |
          docker run -d -p 5000:5000 --name backend ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest

      - name: Run frontend container
        run: |
          docker run -d -p 8080:80 --name frontend ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

      - name: Wait for startup
        run: sleep 15

      - name: Test Backend
        run: curl --fail http://localhost:5000/tasks

      - name: Test Frontend
        run: curl --fail http://localhost:8080

      - name: Cleanup
        if: always()
        run: |
          docker stop backend frontend || true
          docker rm backend frontend || true