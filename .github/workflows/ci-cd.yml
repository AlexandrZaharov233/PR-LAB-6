name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for startup
        run: sleep 20

      - name: Test Backend
        run: curl --fail http://localhost:5000/tasks

      - name: Test Frontend
        run: curl --fail http://localhost:8080

      - name: Test POST task
        run: |
          curl --fail -X POST http://localhost:5000/tasks \
          -H "Content-Type: application/json" \
          -d '{"title":"GitHub Actions Test"}'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest

      - name: Cleanup
        if: always()
        run: docker compose down -v --rmi all